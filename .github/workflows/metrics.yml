
name: GitHub Profile Metrics

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

push:
branches:
- main

permissions:
contents: write

jobs:
metrics:
runs-on: ubuntu-latest

steps:
  - name: Generate GitHub Metrics
    uses: lowlighter/metrics@latest
    with:
      token: ${{ secrets.METRICS_TOKEN }}

      user: zerobits01
      filename: github-metrics.svg

      base: header, activity, community, repositories, metadata

      config_timezone: Asia/Baku
      config_display: large
      config_padding: 0,8

      # Contribution calendar
      plugin_calendar: yes
      plugin_calendar_limit: 1

      # Languages
      plugin_languages: yes
      plugin_languages_limit: 8
      plugin_languages_sections: most-used, recently-used
      plugin_languages_details: percentage

      # Recent GitHub activity
      plugin_activity: yes
      plugin_activity_limit: 8
      plugin_activity_days: 30

      # Achievements
      plugin_achievements: yes
      plugin_achievements_display: compact

      # Coding habits
      plugin_habits: yes
      plugin_habits_from: 200
      plugin_habits_days: 30
      plugin_habits_charts: yes

      # Lines changed
      plugin_lines: yes

      # Repository information
      plugin_repositories: yes
      plugin_repositories_pinned: yes
      plugin_repositories_featured: 6

      # Stars
      plugin_stars: yes
      plugin_stars_limit: 4

      # GitHub Skyline
      plugin_skyline: yes
      plugin_skyline_year: current
      plugin_skyline_frames: 6
      plugin_skyline_quality: 1

      # Keep rendering resilient if a plugin has
      # insufficient permissions/data.
      plugins_errors_fatal: no
